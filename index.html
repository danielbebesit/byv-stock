<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consulta Stock BYV</title>

<style>

body{
    font-family: Arial;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.box{
    background:white;
    padding:30px;
    width:350px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}

#resultado{
    margin-top:20px;
    background:#f9f9f9;
    padding:15px;
    border-radius:8px;
    min-height:50px;
}

</style>

</head>

<body>

<div class="box">

    <h2>Consulta Stock BYV</h2>

    <input
        type="text"
        id="codigo"
        placeholder="Ingrese código"
    >

    <button onclick="buscar()">
        Buscar
    </button>

    <div id="resultado"></div>

</div>

<!-- PAPAPARSE -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

// GOOGLE SHEETS CSV
const url =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTmc9qXnwJ0tE8qlZu19Bt42cNh-sKqO50KwtR5GKTKeYGeRxM14jZ1VD74u7m_Cbjxk1Zc6PEiqmNb/pub?gid=0&single=true&output=csv";

function buscar(){

    const codigoBuscar = document
        .getElementById("codigo")
        .value
        .trim()
        .toUpperCase();

    const resultado =
        document.getElementById("resultado");

    resultado.innerHTML = "Buscando...";

    Papa.parse(url, {

        download: true,

        skipEmptyLines: true,

        complete: function(results){

            const filas = results.data;

            console.log(filas);

            let encontrado = false;

            for(let i = 1; i < filas.length; i++){

                // COLUMNA A = CODIGO
                const codigo = String(filas[i][0] || "")
                    .trim()
                    .toUpperCase();

                // COLUMNA B
                const valorB = String(filas[i][1] || "")
                    .trim();

                // COLUMNA D
                const valorD = String(filas[i][3] || "")
                    .trim();

                console.log(
                    "CODIGO:",
                    codigo,
                    "B:",
                    valorB,
                    "D:",
                    valorD
                );

                if(codigo === codigoBuscar){

                    resultado.innerHTML = `
                        <b>Columna B:</b><br>
                        ${valorB}
                        <br><br>

                        <b>Columna D:</b><br>
                        ${valorD}
                    `;

                    encontrado = true;

                    break;
                }
            }

            if(!encontrado){

                resultado.innerHTML =
                    "Código no encontrado";
            }
        },

        error: function(error){

            resultado.innerHTML =
                "Error leyendo Google Sheets";

            console.log(error);
        }

    });
}

</script>

</body>

</html>
