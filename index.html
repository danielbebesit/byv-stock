<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consulta Stock BYV</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    padding:30px;
    width:350px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#resultado{
    margin-top:20px;
    background:#f9f9f9;
    padding:15px;
    border-radius:8px;
}

</style>

</head>

<body>

<div class="box">

<h2>Consulta Stock BYV</h2>

<input type="text" id="codigo" placeholder="Ingrese código">

<button onclick="buscar()">
Buscar
</button>

<div id="resultado"></div>

</div>

<script>

const url =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTmc9qXnwJ0tE8qlZu19Bt42cNh-sKqO50KwtR5GKTKeYGeRxM14jZ1VD74u7m_Cbjxk1Zc6PEiqmNb/pub?gid=0&single=true&output=csv";

async function buscar(){

    const codigoBuscar = document
        .getElementById("codigo")
        .value
        .trim()
        .toUpperCase();

    const resultado = document.getElementById("resultado");

    resultado.innerHTML = "Buscando...";

    try{

        const response = await fetch(url);

        const texto = await response.text();

        const filas = texto.split("\n");

        let encontrado = false;

        for(let i=0; i<filas.length; i++){

            const columnas = filas[i].split(",");

            // COLUMNA A = CODIGO
            const codigo = columnas[0]
                ?.replace(/"/g,"")
                .trim()
                .toUpperCase();

            // COLUMNA B
            const valorB = columnas[1]
                ?.replace(/"/g,"")
                .trim();

            // COLUMNA D
            const valorD = columnas[3]
                ?.replace(/"/g,"")
                .trim();

            if(codigo === codigoBuscar){

                resultado.innerHTML = `
                    <b>Columna B:</b><br>
                    ${valorB}
                    <br><br>

                    <b>Columna D:</b><br>
                    ${valorD}
                `;

                encontrado = true;
                break;
            }
        }

        if(!encontrado){

            resultado.innerHTML =
                "Código no encontrado";

        }

    }catch(error){

        resultado.innerHTML =
            "Error leyendo Google Sheets";

        console.log(error);

    }

}

</script>

</body>
</html>
